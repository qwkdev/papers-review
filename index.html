<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Review Reviews</title>

	<style>
:root {
	--u: 1.5vw;
}
body {
	margin: 0;
	background: #3b00ff; background-image: linear-gradient(to bottom, #3b00ff, #00f5aa);
	height: 100dvh;
}
*[hidden] {
	display: none !important;
}

#top {
	position: absolute;
	top: .5vh;
	right: .5vh;

	display: flex;
	align-items: center;
	justify-content: end;

	button {
		height: 4vh;
		font-size: 1.75vh;
		font-weight: 600;
		color: #000;
		
		display: flex;
		align-items: center;
		justify-content: center;

		background: #fff;
		border-radius: 4vh;
		border: none;
		padding: 0 2vh;
		gap: .5vh;

		transition: .2s;
		
		svg {
			stroke: #000;
			height: 60%;
			aspect-ratio: 1/1;
		}

		&:hover {
			transform: scale(1.05);

			&:active {
				transform: scale(1);
			}
		}
	}
}
#queue {
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);

	width: 40vh;
	height: 63vh;
	/* border: 1px solid red; */

	display: flex;
	justify-content: center;
	align-items: flex-start;
	z-index: 1;

	&[data-reset="1"] .card {
		transition: none;
	}
}

.card {
	--n: 0;
	--x: 0;
	display: inline-block;
	background: #fff;

	width: calc(100% - 4vh * (1 - var(--anim)/var(--n)) * var(--n));
	height: 60vh;

	position: absolute;
	/* border: 1px solid blue; */
	border-radius: 2vh;

	z-index: calc(4 - var(--n));
	transform: translate(calc(var(--x)*1px), calc(1.5vh * (1 - var(--anim)/var(--n)) * var(--n))) rotate(calc(var(--x) * .02deg));
	opacity: calc(1 - (1/9 * (var(--n) - var(--anim))*(var(--n) - var(--anim))));
	transition: .1s;

	box-sizing: border-box;
	padding: 3vh;

	display: grid;
	grid-template-columns: 1fr;
	grid-template-rows: auto 1fr auto auto;
	align-items: flex-end;

	p, h2, h3, h4, h5 {
		grid-column: 1;
		color: #000;
		font-family: Arial;
		font-weight: 500;
		margin: 0;
	}
	p {
		grid-row: 2;
		align-self: baseline;
		font-size: 2vh;
	}
	h2, h3 {
		grid-row: 3;
		font-size: 2vh;
		margin: 1vh 0;
	}
	h4, h5 {
		&:first-of-type {
			grid-row: 1;
			margin-bottom: .5vh;
		}
		&:last-of-type {
			grid-row: 4;
		}
		font-size: 1.2vh;
	}
	h2, h4 {
		justify-self: end;
	}
	h3 {
		color: #fa0;
	}
}
#active {
	cursor: grab;
	user-select: none;
	touch-action: none;

	transition: transform .3s;

	&[data-drag="1"] {
		cursor: grabbing;
		transition: none;
	}
}



@media only screen and (max-aspect-ratio: 3/7) {
	main {
		width: 80vw;
	}
}
@media only screen and (min-aspect-ratio: 1/1) {
	:root {
		--u: 1.2vh;
	}
}
	</style>
</head>
<body>
	<div id="top">
		<button onclick="undo()">
			<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g><path d="M3 8H16.5C18.9853 8 21 10.0147 21 12.5C21 14.9853 18.9853 17 16.5 17H3M3 8L6 5M3 8L6 11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
			Undo
		</button>
	</div>
	<div id="queue" style="--anim: 0;">
		<div class="card" id="active">
			<p>Loading...</p>
		</div>
		<!-- <div class="card" id="active">
			<h5>#1234</h5>
			<h4>12/34</h4>
			<p>Example review body</p>
			<h3>&#9733;&#9733;&#9733;&#9733;&#9734;</h3>
			<h2>&ndash;&nbsp; Name</h2>
			<h5>123.123.123.123</h5>
			<h4>30/09/26 &nbsp;&bullet;&nbsp; 15:01:07</h4>
		</div> -->
		<div class="card" style="--n: 1;" id="second"></div>
		<div class="card" style="--n: 2;"></div>
		<div class="card" style="--n: 3;"></div>
	</div>

	<script>
		const target = 200;
		let active = true;
		let current = -1;

		const SERVER = 'https://qwk.pythonanywhere.com/contact';
		async function checkAPIKey(key) {
			const resp = await fetch(`${SERVER}/check?key=${key}`, { method: 'GET' })
				.then(resp => resp.json())
				.catch(e => console.error('Error checking API key:', e));

			return resp && resp['valid'];
		}
		async function getAPIKey() {
			let current = localStorage.getItem('contact-api-key');
			if (current && await checkAPIKey(current)) {
				return current;
			}
			localStorage.removeItem('contact-api-key');

			while (1) {
				const newKey = prompt('Enter API Key:');
				if (newKey && await checkAPIKey(newKey)) {
					localStorage.setItem('contact-api-key', newKey);
					return newKey;
				} else {
					alert('Invalid API Key, please try again.');
				}
			}
		}

		let API_KEY;
		(async () => {
			API_KEY = await getAPIKey();
			init();
		})();


		const cardqueue = document.getElementById('queue');

		async function wait(ms) {
			return new Promise(resolve => setTimeout(resolve, ms));
		}
		async function anim() {
			for (let n = 1; n <= 100; n++) {
				cardqueue.style.setProperty('--anim', n/100);
				await wait(10);
			}
			await wait(10);
			cardqueue.style.setProperty('--anim', 0/100);
		}

		const activecard = document.getElementById('active');
		const secondcard = document.getElementById('second');

		let start;
		activecard.addEventListener('pointerdown', e => {
			if (!active || cardqueue.dataset.ignore == '1') return;
			start = e.clientX;
			activecard.dataset.drag = '1';
		});
		document.addEventListener('pointermove', e => {
			if (activecard.dataset.drag != '1' || cardqueue.dataset.ignore == '1') return;
			let delta = e.clientX - start;
			activecard.style.setProperty('--x', delta);
			cardqueue.style.setProperty('--anim', Math.min(Math.abs(delta)/target, 1));
		});



		let reviews = [];
		function init() {
			fetch(`${SERVER}/api?key=${API_KEY}`, { method: 'GET' })
				.then(r => r.json())
				.then(data => {
					// if (!data.success) throw Error(data.error || 'Error');
					// reviews = data.reviews;
					reviews.push([
						// Done! text
					]);

					activecard.innerHTML = '<p>Swipe RIGHT to add,<br>Swipe LEFT to delete</p>';
					current = -1;
					loadReview(current+1, secondcard);
					active = true;
				})
				.catch(e => {
					alert('Error fetching reviews:', e);
					console.error('Error fetching reviews:', e);
				});
		}

		function parseISO(isoStr) {
			const date = new Date(isoStr);
			const pad = (n) => n.toString().padStart(2, '0');
			return [
				`${pad(date.getDate())}/${pad(date.getMonth() + 1)}/${date.getFullYear().toString().slice(-2)}`,
				`${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`
			];
		}
		function loadReview(ri, card) {
			const r = reviews[ri];
			card.innerHTML = `
				<h5>#${r[0]}</h5>
				<h4>${ri+1}/${reviews.length-1}</h4>
				<p>Example review body</p>
				<h3>&#9733;&#9733;&#9733;&#9733;&#9734;</h3>
				<h2>&ndash;&nbsp; Name</h2>
				<h5>123.123.123.123</h5>
				<h4>${parseISO(r[1]).join(' &nbsp;&bullet;&nbsp; ')}</h4>
			`;
		}
		async function undo() {
			if (current <= 0) return;

			active = false;

			loadReview(current-1, activecard);
			loadReview(current, secondcard);

			// await edit status to 0

			active = true;
			current -= 1;
		}

		function edit(edits) {
			return fetch(`${SERVER}/...`, {
				method: 'POST',
				headers: {
					
				}
			}).then(r => r.json()) .catch(e => {
				alert('Error fetching reviews:', e);
				console.error('Error fetching reviews:', e);

				return { success: false, error: e };
			});
		}


		const release = e => {
			if (activecard.dataset.drag != '1' || cardqueue.dataset.ignore == '1') return;
			activecard.dataset.drag = '0';

			delta = e.clientX - start;
			if (Math.abs(delta) >= target) {
				cardqueue.dataset.ignore = '1';
				cardqueue.style.setProperty('--anim', 1);
				activecard.style.setProperty('--x', window.innerWidth * (delta > 0 ? 1 : -1));
				setTimeout(async () => {
					if (current < review.length-1) {
						if (current >= 0) {
							// edit status to (delta > 0 ? 1 : -1)
						}
						current++;
					} else active = false;
					activecard.innerHTML = secondcard.innerHTML;

					cardqueue.dataset.reset = '1';
					activecard.style.setProperty('--x', 0);
					cardqueue.style.setProperty('--anim', 0);
					setTimeout(() => {
						cardqueue.dataset.reset = '0';
						cardqueue.dataset.ignore = '0';
					}, 50);

					if (current < review.length-1) loadNext();
				}, 100);
			} else {
				activecard.style.setProperty('--x', 0);
				cardqueue.style.setProperty('--anim', 0);
			}
		};
		document.addEventListener('pointerup', release);
		document.addEventListener('pointercancel', release);
	</script>
</body>
</html>
